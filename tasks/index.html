  try{await navigator.clipboard.writeText(t)}
  catch(e){const el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();document.execCommand('copy');el.remove()}
  b.textContent='✓ 已复制';setTimeout(()=>b.textContent=copyLabel,1500);
 });
}
function resetSchool(school){
 students=students.filter(p=>p.school!==school).concat(DEMO.filter(p=>p.school===school));
 const original=SCHOOL_META.find(m=>m.school===school);
 schoolMeta=schoolMeta.map(m=>m.school===school?{...original}:m);
}
function teacherSetup(){
 const versions={h:0,f:0};
 $('search').oninput=render;
 $('school').onchange=()=>{selectedSchool=$('school').value;selected='全部';render()};
 $('reset').onclick=()=>{
  students=DEMO.map(p=>({...p}));schoolMeta=SCHOOL_META.map(m=>({...m}));
  for(const key of ['h','f']){versions[key]++;$('csv-'+key).value=''}
  $('search').value='';$('school').value='全部';selectedSchool='全部';selected='全部';render();
 };
 for(const [key,school] of [['h','华山小学'],['f','附小']]){
  $('csv-'+key).onchange=async e=>{
   const version=++versions[key],f=e.target.files[0];
   if(!f){resetSchool(school);render();return}
   try{
    const rows=csvRows(await f.text()),dates=validateRows(rows);
    const day=rows.filter(r=>r['查询日期'].trim()===dates[0]);
    const next=convert(day,DONE_ONLY).map(p=>({...p,school}));
    if(version!==versions[key])return;
    const m={school,date:dates[0],totalRows:day.length,totalStudents:convert(day,false).length,completedRows:day.filter(isCompleted).length,completedStudents:convert(day,true).length};
    students=students.filter(p=>p.school!==school).concat(next);
    schoolMeta=schoolMeta.map(old=>old.school===school?m:old);
    selected='全部';$('search').value='';render();
    alert('已在本地预览'+school+' '+dates[0]+' 的'+(DONE_ONLY?'完成情况':'全部学习任务')+'。'+(dates.length>1?'CSV 有多个日期，本页仅显示最新日期。':'')+'文件没有上传；另一学校的数据保留，刷新后恢复发布数据。');
   }catch(err){if(version===versions[key])alert(school+'读取失败：'+err.message)}
  };
 }
 render();
}
teacherSetup();

</script></body></html>
