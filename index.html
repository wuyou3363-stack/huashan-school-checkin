<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>华山小学 · 每日完成情况</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#20392b;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(120deg,#147947,#27a16d);color:#fff;padding:34px 18px 62px}.wrap{max-width:980px;margin:auto}.hero h1{margin:0;font-size:27px}.hero p{opacity:.9;margin:10px 0 0;font-size:14px}.panel{background:#fff;border-radius:18px;padding:18px;margin:-36px auto 22px;box-shadow:0 8px 28px #174f3015;position:relative}.search{width:100%;font:inherit;padding:14px 16px;border:1px solid #d5e4d8;border-radius:12px;outline:none}.search:focus{border-color:#289c65}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.pill{border:1px solid #d8e9df;background:white;color:#38624a;border-radius:99px;padding:8px 14px;cursor:pointer}.pill.active{background:#197c4d;color:#fff;border-color:#197c4d}.count{margin-left:auto;color:#667b6c;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:17px;margin-bottom:30px}.card{background:white;border:1px solid #e2ece5;border-radius:18px;padding:19px;box-shadow:0 3px 14px #173d2410}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-size:21px;font-weight:750}.tag{background:#e8f6ec;color:#16844b;border-radius:7px;padding:5px 9px;font-size:12px}.book{font-weight:650;color:#32764b;margin:12px 0}.section{margin:15px 0}.unit{font-size:13px;font-weight:750;color:#17764b;border-bottom:1px solid #e8eee9;padding-bottom:8px;margin-bottom:8px}.rows{display:flex;flex-wrap:wrap;gap:7px}.item{background:#f1f7f2;border-radius:8px;padding:7px 9px;font-size:13px;color:#3b5543}.extra{background:#f3f5f4;border-radius:10px;padding:10px 12px;color:#657168;font-size:13px;margin-top:12px;line-height:1.8}.copy{width:100%;border:1px solid #27925b;color:#18834f;background:#fff;border-radius:10px;padding:11px;margin-top:15px;font-size:14px;cursor:pointer}.copy:hover{background:#eff9f2}.notice{font-size:13px;line-height:1.7;color:#697b6e;margin:16px 0 28px}.empty{grid-column:1/-1;text-align:center;padding:55px 12px;color:#708476}.small{font-size:12px;color:#6c8572}.tools{margin:14px 0 0;padding-top:12px;border-top:1px dashed #e1ebe4}input[type=file]{max-width:100%;font-size:13px}button{font-family:inherit}@media(max-width:600px){.hero h1{font-size:23px}.panel{margin-left:12px;margin-right:12px}.cards{padding:0 12px}.notice{padding:0 12px}}
</style></head><body><header class="hero"><div class="wrap"><h1>✅ 华山小学 · 每日完成情况</h1><p id="snapshot"></p></div></header><main class="wrap"><div class="panel"><input class="search" id="search" placeholder="搜索学生姓名" autocomplete="off"><div class="bar" id="grades"></div><div class="tools"><div class="small">本页显示华山小学已发布的完成情况。本地选择 CSV 仅用于预览，不会更新网站。</div><input id="csv" type="file" accept=".csv,text/csv" style="margin-top:9px"><button class="pill" id="reset" style="margin-left:8px">恢复发布数据</button></div></div><div class="cards" id="cards"></div><p class="notice">网页包含学生姓名和任务记录，请仅在获得学校授权后公开发布。本地选择 CSV 只更新当前浏览器显示；刷新后恢复本网页内的发布数据。</p></main><script>
const DEMO=[];
let students=DEMO,selected='全部';const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanName(n){return String(n||'').replace(/新生\s*$/,'').trim()}function gradeOf(n,b){const m=String(n).match(/(?:^|\D)([3-6])\s*[.．年]/);if(m)return +m[1];const t=String(b||'');return ({三:3,四:4,五:5,六:6})[(t.match(/[三四五六]上|[三四五六]下/)||[''])[0]?.[0]]||0}function unitOf(s){return (String(s||'').match(/Unit\s*\d+(?:\s*[（(][^）)]+[）)])?/i)||[])[0]||String(s||'其他任务')}
function csvRows(t){if(t.charCodeAt(0)===65279)t=t.slice(1);let out=[],row=[],v='',quote=false;for(let i=0;i<t.length;i++){const c=t[i];if(quote){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')quote=false;else v+=c}else if(c==='"')quote=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))out.push(row);const headers=out.shift()||[];return out.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),r[i]||''])))}
function shortBook(b){return String(b||'').replace(/[（(]20\d{2}[）)]/g,'').trim()}
function shortUnit(u){return String(u||'').replace(/^Unit\s*(\d+)/i,'U$1')}
function isCompleted(r){return /^(已完成|完成)$/.test(String(r['完成状态']||'').replace(/[\s\u00a0\u3000]/g,''))}
function convert(rows,doneOnly=false){
 const people=new Map();
 const gradeOf=(n,b)=>{const m=n.match(/(?:^|\D)([1-9])\s*[.．年]/);if(m)return +m[1];return ({一:1,二:2,三:3,四:4,五:5,六:6})[(b.match(/[一二三四五六][上下]/)||[''])[0][0]]||0};
 for(const r of rows){
  if(doneOnly&&!isCompleted(r))continue;
  const name=String(r['学生姓名']||'').trim();if(!name)throw Error('存在学生姓名为空的记录，请核对 CSV');
  const uid=String(r['用户ID']||'').trim(),account=String(r['登录账号']||'').trim();
  const personKey=uid?'id:'+uid:account?'account:'+account:'name:'+name;
  const book=String(r['教材名称']||'').trim(),version=String(r['教材版本']||'').trim(),type=String(r['学习类型']||'').trim(),category=String(r['任务分类']||'').trim();
  const rawModule=String(r['任务项目']||r['模块名称']||r['学习模块']||'其他任务').trim();
  // 学习类型只决定动作；词组须由任务项目或教材版本明确标识。
  const module=/词组|固定搭配/.test(rawModule)||rawModule==='单词'&&/词组|固定搭配/.test(version)?'词组':rawModule;
  const quantity=parseInt(r['目标数量'],10)||0,unit=String(r['单元名称']||'').trim();
  let p=people.get(personKey);
  if(!p){p={name,grade:gradeOf(name,book),book,units:[],text:0,practice:0,phonetic:0,reading:0,_reading:new Set(),_groups:new Map(),_extras:new Map()};people.set(personKey,p)}
  if(p.name!==name)throw Error('同一用户ID或账号对应不同姓名：'+p.name+' / '+name+'，已停止生成，请核对 CSV');
  if(!p.grade)p.grade=gradeOf(name,book);if(!p.book&&book)p.book=book;
  const addExtra=kind=>{const key=JSON.stringify([kind,book,version]);let x=p._extras.get(key);if(!x){x={kind,book,version,count:0};p._extras.set(key,x)}x.count++};
  if(/阅读理解/.test([rawModule,unit,type,category,version,book].join(' '))){const key=JSON.stringify([book,version,unit||type||category]);if(!p._reading.has(key)){p._reading.add(key);addExtra('reading')}continue}
  if(module==='同步课文'&&!/阅读理解|听力|听写/.test(type)){p.text++;addExtra('text');continue}
  if((module==='同步练习'||module==='专项训练'&&/同步练习|同步训练/.test(type))&&!/阅读理解|听力|听写/.test(type)){p.practice++;addExtra('practice');continue}
  if(module==='音标'||/音标/.test(type)){p.phonetic++;addExtra('phonetic');continue}
  const u=(unit.match(/Unit\s*\d+(?:\s*[（(][^）)]+[）)])?/i)||[])[0]||unit||rawModule;
  const key=JSON.stringify([module,book,version,u]);let group=p._groups.get(key);
  if(!group){group={unit:u.replace(/^Unit\s*(\d+)/i,'U$1'),book,version,module,_items:new Set()};p._groups.set(key,group)}
  let title;
  if(/闯关/.test(category)||/闯关/.test(type))title='完成'+module+(type&&type!=='学习'?type:'')+'闯关';
  else title=!type||type===module||type.startsWith(module)?type||module:module+type;
  if(quantity>0&&!/闯关|课文|阅读理解/.test(title))title+=quantity+'个';
  group._items.add(title);
 }
 return [...people.values()].map(p=>{p.units=[...p._groups.values()].map(g=>({unit:g.unit,book:g.book,version:g.version,module:g.module,items:[...g._items]}));p.reading=p._reading.size;p.extras=[...p._extras.values()];delete p._reading;delete p._groups;delete p._extras;return p}).sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,'zh-CN'));
}
function extraLines(p){
 if(!p.extras)return [p.reading?'完成阅读理解'+p.reading+'篇':'',p.text?'完成课文跟读'+p.text+'篇':'',p.practice?'完成同步练习'+p.practice+'个':'',p.phonetic?'完成音标学习'+p.phonetic+'个':''].filter(Boolean);
 return p.extras.map(x=>({reading:'完成阅读理解'+x.count+'篇',text:'完成课文跟读'+x.count+'篇',practice:'完成同步练习'+x.count+'个',phonetic:'完成音标学习'+(x.count===1?'一个':x.count+'个')})[x.kind]+(x.kind!=='practice'&&x.book&&x.book!==p.book?'（'+x.book+'）':''));
}
function taskOrder(t){const x=String(t);const module=x.includes('单词')?0:x.includes('词组')?1:x.includes('句子')?2:3;const stage=x.includes('闯关')?2:x.includes('跟读')?0:1;const kind=x.includes('记忆')?0:x.includes('翻译')?1:x.includes('听力')?2:3;return module*100+stage*10+kind}
function sortTasks(){for(const p of students){for(const g of p.units){g.items.sort((a,b)=>taskOrder(a)-taskOrder(b))}}}
function describe(p){let s=p.name+'\n今日完成'+(shortBook(p.book)||'教材待确认');for(const g of p.units)s+='\n'+g.unit+(g.book&&g.book!==p.book?' · '+g.book:'')+'\n'+g.items.join('\n');if(extraLines(p).length)s+='\n'+extraLines(p).join('\n');return '华山小学'+(META.date?' · '+META.date:'')+'\n'+s}
function render(){sortTasks();const q=$('search').value.trim().toLowerCase();const gs=['全部',...new Set(students.map(p=>p.grade).filter(Boolean).sort((a,b)=>a-b))];$('grades').innerHTML=gs.map(g=>'<button class="pill '+(selected===g?'active':'')+'" data-g="'+g+'">'+(g==='全部'?'全部年级':g+'年级')+'</button>').join('')+'<span class="count" id="count"></span>';document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{selected=b.dataset.g==='全部'?'全部':+b.dataset.g;render()});const shown=students.filter(p=>(selected==='全部'||p.grade===selected)&&p.name.toLowerCase().includes(q));$('count').textContent='共 '+shown.length+' 名已打卡学生';$('cards').innerHTML=shown.length?shown.map((p,i)=>'<article class="card"><div class="head"><span class="name">'+escapeHTML(p.name)+'</span><span class="tag">'+(p.grade?p.grade+'年级':'未识别年级')+'</span></div><div class="book">今日完成 '+escapeHTML(shortBook(p.book)||'相关教材')+'</div>'+p.units.map(g=>'<div class="section"><div class="unit">'+escapeHTML(g.unit)+(' · '+escapeHTML(g.module))+(g.book&&g.book!==p.book?' · '+escapeHTML(shortBook(g.book)):'')+'</div><div class="rows">'+g.items.map(it=>'<span class="item">'+escapeHTML(it)+'</span>').join('')+'</div></div>').join('')+((p.reading||p.text||p.practice||p.phonetic)?'<div class="extra">'+extraLines(p).map(escapeHTML).join('<br>')+'</div>':'')+'<button class="copy" data-copy="'+i+'">📋 复制打卡记录</button></article>').join(''):'<div class="empty">暂无符合条件的已完成任务</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=shown[+b.dataset.copy],t=describe(p);try{await navigator.clipboard.writeText(t)}catch(e){const el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();document.execCommand('copy');el.remove()}b.textContent='✓ 已复制';setTimeout(()=>b.textContent='📋 复制打卡记录',1500)})}
$('search').oninput=render;$('reset').onclick=()=>{students=DEMO;$('csv').value='';$('search').value='';selected='全部';render()};$('csv').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=csvRows(await f.text());if(!rows.length||!('学生姓名' in rows[0])||!('完成状态' in rows[0]))throw Error('CSV 缺少学生姓名或完成状态字段');students=convert(rows,true);selected='全部';$('search').value='';render();alert('已在当前浏览器中读取 '+students.length+' 名学生的已完成任务。未上传任何数据；刷新网页后恢复发布数据。')}catch(err){alert('读取失败：'+err.message)}};render();
const META={"date":"","totalRows":0,"completedRows":0,"completedStudents":0};
const REQUIRED=["查询日期","学生姓名","完成状态","任务项目","教材名称","教材版本","学习类型","单元名称","任务分类","目标数量"];
function validateRows(rows){
 if(!rows.length)throw Error('CSV 中没有任务记录');
 const missing=REQUIRED.filter(k=>!(k in rows[0]));
 if(missing.length)throw Error('CSV 缺少列：'+missing.join('、'));
 for(let i=0;i<rows.length;i++){
  const r=rows[i],date=String(r['查询日期']||'').trim(),d=new Date(date+'T00:00:00Z');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==date)throw Error('第 '+(i+2)+' 行日期无效，请使用 YYYY-MM-DD');
  if(!String(r['学生姓名']||'').trim())throw Error('第 '+(i+2)+' 行学生姓名为空');
  if(!String(r['用户ID']||r['登录账号']||'').trim())throw Error('第 '+(i+2)+' 行缺少用户ID或登录账号，请使用教室端任务明细 CSV');
  if(!/^(已完成|完成|未完成)$/.test(String(r['完成状态']||'').replace(/[\s\u00a0\u3000]/g,'')))throw Error('第 '+(i+2)+' 行完成状态无法识别：'+r['完成状态']);
 }
 convert(rows,false);
 return [...new Set(rows.map(r=>r['查询日期'].trim()))].sort().reverse();
}
function teacherSetup(){
 const published={...META};
 function showMeta(){document.getElementById('snapshot').textContent=META.date?'数据日期：'+META.date+' · '+META.completedStudents+' 名学生有已完成任务 · 已完成 '+META.completedRows+' / '+META.totalRows+' 条任务':'尚未导入学习记录'}
 $('csv').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const rows=csvRows(await f.text()),dates=validateRows(rows),day=rows.filter(r=>r['查询日期'].trim()===dates[0]),next=convert(day,true);
   Object.assign(META,{date:dates[0],completedStudents:next.length,completedRows:day.filter(isCompleted).length,totalRows:day.length});
   students=next;selected='全部';$('search').value='';showMeta();render();
   alert('已在本地预览 '+dates[0]+' 的完成情况。'+(dates.length>1?'CSV 有多个日期，本页仅显示最新日期。':'')+'文件没有上传，刷新后恢复发布数据。');
  }catch(err){alert('读取失败：'+err.message)}
 };
 $('reset').onclick=()=>{students=DEMO;$('csv').value='';$('search').value='';selected='全部';Object.assign(META,published);showMeta();render()};
 showMeta();
}
teacherSetup();
</script></body></html>
